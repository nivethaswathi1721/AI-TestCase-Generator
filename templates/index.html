<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Test Case Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <h1 class="text-center text-primary">
            🤖 AI Test Case Generator
        </h1>

        <p class="text-center text-muted">
            Generate Functional, Positive, Negative, BVA and Edge Test Cases using Gemini AI
        </p>

        <form action="/generate" method="POST" id="testcaseForm">

            <div class="mb-3">

                <label class="form-label">
                    Enter Software Requirement
                </label>

                <textarea
                    class="form-control"
                    rows="8"
                    name="requirement"
                    placeholder="Example: User should be able to login using Email and Password"
                    required></textarea>

            </div>

            <button
                type="submit"
                id="generateBtn"
                class="btn btn-primary w-100">

                <span id="btnText">
                    🚀 Generate Test Cases
                </span>

                <span
                    id="loadingSpinner"
                    class="spinner-border spinner-border-sm ms-2"
                    style="display:none;"
                    role="status"
                    aria-hidden="true">
                </span>

            </button>

        </form>

    </div>

</div>

<script>

document.getElementById("testcaseForm").addEventListener("submit", function () {

    let btn = document.getElementById("generateBtn");

    btn.disabled = true;

    document.getElementById("btnText").innerHTML =
        "⏳ Generating Test Cases... Please Wait";

    document.getElementById("loadingSpinner").style.display =
        "inline-block";

});

</script>

</body>

</html>
